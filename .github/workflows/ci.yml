name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt
          pip install ruff black pytest

      - name: Architecture gate
        run: |
          . .venv/bin/activate
          python tools/check_architecture.py --root . --format json --fail-under 10 > arch_report.json

      - name: Upload architecture report
        uses: actions/upload-artifact@v4
        with:
          name: arch_report
          path: arch_report.json

      - name: Lint (Ruff)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Tests
        run: |
          . .venv/bin/activate
          pytest -q