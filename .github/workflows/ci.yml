name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  afritech-ci:
    name: AfriTech Constitutional CI
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # Checkout (Authority: External Source Control)
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Python Runtime (Defined & Immutable)
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------
      # Dependencies (Build-time only)
      # ----------------------------------------------------
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------
      # CORE LAW ENFORCEMENT
      # These tests define truth itself.
      # ----------------------------------------------------
      - name: Run core decision tests
        run: |
          pytest tests/core

      # ----------------------------------------------------
      # DERIVE CONSTITUTIONAL PROOF FROM TESTS
      # ----------------------------------------------------
      - name: Generate invariant documentation
        run: |
          python3 tools/docgen/extract_invariants.py

      - name: Verify invariants are up to date
        run: |
          git diff --exit-code docs/generated/invariants.md

      # ----------------------------------------------------
      # LANGUAGE SEMANTIC HYGIENE (ADR-TV-002)
      # ----------------------------------------------------
      - name: Enforce future import placement
        run: |
          python3 tools/check_future_imports.py

      # ----------------------------------------------------
      #ADR-BI-003 - Import Boundary Enforcement
      # ----------------------------------------------------
      - name: Enforce import boundaries
        run: |
          python3 tools/check_import_boundaries.py

      # ----------------------------------------------------
      # ADR-BI-004 - Global Mutable State Enforcement
      # ----------------------------------------------------
      - name: Enforce global mutable state prohibition
        run: |
          python3 tools/check_global_mutable_state.py

      # ----------------------------------------------------
      # ADR-OP-001 - Static Analysis for Runtime Mutation (Detector Only)
      # ----------------------------------------------------
      - name: Enforce runtime mutation prohibition (ADR-OP-001)
        run: |  
          python3 tools/check_runtime_mutation.py --check

      # ----------------------------------------------------
      # ADR-000-Emforcement-Tests - Core Freeze Tests
      # ----------------------------------------------------
      - name: Enforce Core Freeze (ADR-000)
        run: |
          
          python3 tools/core_enforcement/check_core_freeze.py


      #   
      - name: Enforce Core Checksum Ledger (ADR-000)
        run: python3 tools/core_enforcement/check_core_checksums.py


      - name: Enforce Clock / Time Injection (ADR-KE-FT-001)
        run: python3 tools/purity_checks/check_time_access.py

      # ----------------------------------------------------
      # (INTENTIONALLY LEFT OUT FOR NOW)
      # - Execution tests
      # - ADR governance
      # These will be added as separate jobs
      # once ratified via ADR.
      # ----------------------------------------------------