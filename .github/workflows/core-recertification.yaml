name: Core Re-Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-recertification:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce Core Freeze
        run: python3 tools/core_enforcement/check_core_freeze.py

      - name: Verify Core Checksum Ledger
        run: python3 afritech/tools/core_enforcement/check_core_checksums.py

      - name: Run Core Re-Certification Tests
        run: pytest tests/core/recertification -v