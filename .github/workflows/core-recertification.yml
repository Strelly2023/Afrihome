name: Core Re-Certification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  core-recertification:
    name: Core Re-Certification (ADR-000A)
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Python setup
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ------------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Core enforcement gates
      # ------------------------------------------------------------------
      - name: Enforce Core Freeze
        run: python3 tools/core_enforcement/check_core_freeze.py

      - name: Verify Core Checksum Ledger
        run: python3 tools/core_enforcement/check_core_checksums.py

      # ------------------------------------------------------------------
      # Re-certification tests
      # ------------------------------------------------------------------
      - name: Run Core Re-Certification Tests
        run: pytest tests/core/recertification -v