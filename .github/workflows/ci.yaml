name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  afritech-ci:
    name: AfriTech Constitutional CI
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # Source Control
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Python Runtime (Pinned)
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------
      # Dependency Installation
      # ----------------------------------------------------
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -e .

      # ----------------------------------------------------
      # CONSTITUTIONAL TESTS (META-LAWS)
      # ----------------------------------------------------
      - name: Run constitutional tests
        run: |
          pytest tests/constitution

      # ----------------------------------------------------
      # DOMAIN / CORE TESTS (BUSINESS LAW)
      # ----------------------------------------------------
      - name: Run core and domain tests
        run: |
          pytest tests/core

      # ----------------------------------------------------
      # GOVERNANCE ENFORCEMENT (THE LAW)
      # ----------------------------------------------------
      - name: Run AfriTech governance checks
        run: |
          afritech check

      # ----------------------------------------------------
      # SUCCESS SUMMARY
      # ----------------------------------------------------
      - name: Governance Summary
        if: success()
        run: |
          echo "✅ AfriTech governance, law, and invariants passed"
