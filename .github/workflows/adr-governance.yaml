name: AfriTech CI (Constitutional)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ============================================================
# GLOBAL SAFETY — COURT DISCIPLINE
# ============================================================
concurrency:
  group: afritech-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:

# ============================================================
# JOB 1 — CONSTITUTION (LAW VALIDITY)
# ============================================================
  constitution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (deterministic)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify constitutional invariants
        run: |
          pytest tests/constitution -v


# ============================================================
# JOB 2 — CORE (SEMANTIC IMMUTABILITY)
# ============================================================
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: constitution

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (deterministic)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify core semantics
        run: |
          pytest tests/core -v


# ============================================================
# JOB 3 — GOVERNANCE (COURT EXECUTION)
# ============================================================
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install governance runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # --------------------------------------------------------
      # Build canonical Execution Manifest
      # --------------------------------------------------------
      - name: Build Execution Manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from afritech.governance.ownership.compiler_v2 import compile_ownership_v2
          from afritech.governance.execution.compiler_v1 import compile_execution_manifest

          plan = compile_ownership_v2(Path("afritech/governance/ownership/registry.json"))
          manifest = compile_execution_manifest(plan)

          Path("build").mkdir(exist_ok=True)
          Path("build/execution_manifest.json").write_text(manifest.to_json())
          Path("build/manifest.hash").write_text(manifest.manifest_hash)
          PY

      # --------------------------------------------------------
      # Constitutional governance enforcement
      # --------------------------------------------------------
      - name: Run constitutional governance
        run: |
          afritech check --manifest build/execution_manifest.json

      # --------------------------------------------------------
      # Deterministic trace generation
      # --------------------------------------------------------
      - name: Generate deterministic execution trace
        run: |
          python - <<'PY'
          from pathlib import Path
          from afritech.governance.runtime.execution_trace_collector import collect_trace
          from afritech.governance.runtime.trace_replay_validator import (
              canonicalize_trace,
              compute_trace_hash,
          )

          trace = collect_trace()
          canonical = canonicalize_trace(trace)
          trace_hash = compute_trace_hash(trace)

          Path("build/trace.json").write_text(canonical)
          Path("build/trace.hash").write_text(trace_hash)
          PY

      # --------------------------------------------------------
      # Compute real environment hash (non‑fictional)
      # --------------------------------------------------------
      - name: Compute environment hash
        run: |
          python - <<'PY'
          import hashlib, platform, sys

          payload = {
              "python": sys.version,
              "platform": platform.platform(),
          }

          raw = repr(sorted(payload.items()))
          h = hashlib.sha256(raw.encode()).hexdigest()
          open("build/env.hash", "w").write(h)
          PY

      # --------------------------------------------------------
      # Build execution attestation
      # --------------------------------------------------------
      - name: Build execution attestation
        run: |
          python - <<'PY'
          from pathlib import Path
          from afritech.governance.runtime.execution_attestation import (
              ExecutionAttestation,
              compute_attestation_hash,
          )

          att = ExecutionAttestation(
              manifest_hash=Path("build/manifest.hash").read_text().strip(),
              trace_hash=Path("build/trace.hash").read_text().strip(),
              env_hash=Path("build/env.hash").read_text().strip(),
              ci_run_id="${{ github.run_id }}",
          )

          Path("build/attestation.hash").write_text(
              compute_attestation_hash(att)
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: afritech-build
          path: build/


# ============================================================
# JOB 4 — HYGIENE (STRUCTURAL, NON‑SEMANTIC)
# ============================================================
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: governance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Structural hygiene check
        run: |
          python afritech/tools/afritech_lint.py \
            --root afritech \
            --format text


# ============================================================
# JOB 5 — SNAPSHOT + INTEGRITY (REPLAY & STABILITY)
# ============================================================
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hygiene

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: afritech-build
          path: build/

      - name: Snapshot lint state
        run: |
          python afritech/tools/afritech_lint.py \
            --root afritech \
            --format json > lint.json

      - name: Validate snapshot stability
        run: |
          python - <<'PY'
          import json

          cur = json.load(open("lint.json"))
          base = json.load(open("afritech/governance/snapshots/lint.snapshot.json"))

          if (cur.get("score"), cur.get("total")) != (base.get("score"), base.get("total")):
              raise SystemExit("❌ Snapshot drift detected")

          print("✅ Snapshot stable")
          PY

      - name: Validate trace replay
        run: |
          python - <<'PY'
          import json
          from afritech.governance.runtime.trace_replay_validator import validate_trace_replay

          trace = json.loads(open("build/trace.json").read())
          expected = open("build/trace.hash").read().strip()

          validate_trace_replay(trace, expected)
          PY

      - name: Validate execution attestation
        run: |
          python - <<'PY'
          from pathlib import Path
          from afritech.governance.runtime.execution_attestation import (
              ExecutionAttestation,
              validate_attestation,
          )

          att = ExecutionAttestation(
              manifest_hash=Path("build/manifest.hash").read_text().strip(),
              trace_hash=Path("build/trace.hash").read_text().strip(),
              env_hash=Path("build/env.hash").read_text().strip(),
              ci_run_id="${{ github.run_id }}",
          )

          validate_attestation(
              att,
              Path("build/attestation.hash").read_text().strip(),
          )
          PY


# ============================================================
# JOB 6 — SUMMARY (COURT VERDICT)
# ============================================================
  summary:
    runs-on: ubuntu-latest
    needs: [constitution, core, governance, hygiene, snapshot]
    if: success()

    steps:
      - run: |
          echo "=============================================="
          echo "✅ AfriTech CI — CONSTITUTIONAL PASS"
          echo "✔ Constitution verified"
          echo "✔ Core semantics verified"
          echo "✔ Governance enforced"
          echo "✔ Trace replay verified"
          echo "✔ Execution attested"
          echo "✔ Snapshot stable"
          echo "=============================================="
