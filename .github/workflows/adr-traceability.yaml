name: ADR Traceability Enforcement

on:
  push:
  pull_request:

jobs:
  adr-traceability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate ADR Traceability
        run: python3 afritech/tools/adr/validate_adr_traceability.py