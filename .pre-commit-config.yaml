repos:
  - repo: local
    hooks:

      # =================================================
      # AfriTech Constitutional Governance Hook
      # =================================================
      - id: afritech-governance
        name: AfriTech — Constitutional Governance Enforcement
        entry: python3 -m afritech.guards.run
        language: system

        # Pre-commit must NOT pass filenames
        pass_filenames: false

        # Scope enforcement at the hook level
        files: ^(afritech/|config/|tests/|adr/)
        exclude: |
          (?x)^(
            tools/|
            _quarantine/|
            architecture/|
            contracts/|
            docs/|
            .*\.LEGACY$
          )

        stages: [pre-commit]
