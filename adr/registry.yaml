    status: ACCEPTED

  - id: ADR-008
    title: Runtime Mutation Ban
    status: ACCEPTED

  - id: ADR-009
    title: Public API Freeze
    status: ACCEPTED

  - id: ADR-010
    title: Legacy Is Explicit
    status: ACCEPTED

  - id: ADR-011
